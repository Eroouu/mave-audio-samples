<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAVE Audio Samples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.5;
            color: #111827;
        }

        h1 {
            margin-bottom: 8px;
        }

        .sample {
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 20px;
            margin: 24px 0;
        }

        .audio-row {
            margin: 14px 0;
        }

        audio {
            width: 100%;
            margin-top: 6px;
        }

        .label {
            font-weight: 700;
        }
    </style>
</head>

<body>
    <h1>MAVE Audio Samples</h1>
    <p>Generated examples for comparing Original MAVE and Cross-Attn MAVE.</p>

    <div class="sample">
        <h2>Sample 1</h2>

        <div class="audio-row">
            <div class="label">Ground Truth</div>
            <audio controls>
                <source src="audio/sample1_ground_truth.wav" type="audio/wav">
            </audio>
        </div>

        <div class="audio-row">
            <div class="label">Original MAVE</div>
            <audio controls>
                <source src="audio/sample1_original_mave.wav" type="audio/wav">
            </audio>
        </div>

        <div class="audio-row">
            <div class="label">Cross-Attn MAVE</div>
            <audio controls>
                <source src="audio/sample1_cross_attn_mave.wav" type="audio/wav">
            </audio>
        </div>
    </div>

    <div class="sample">
        <h2>Sample 2</h2>

        <div class="audio-row">
            <div class="label">Ground Truth</div>
            <audio controls>
                <source src="audio/sample2_ground_truth.wav" type="audio/wav">
            </audio>
        </div>

        <div class="audio-row">
            <div class="label">Original MAVE</div>
            <audio controls>
                <source src="audio/sample2_original_mave.wav" type="audio/wav">
            </audio>
        </div>

        <div class="audio-row">
            <div class="label">Cross-Attn MAVE</div>
            <audio controls>
                <source src="audio/sample2_cross_attn_mave.wav" type="audio/wav">
            </audio>
        </div>
    </div>
</body>

</html>
